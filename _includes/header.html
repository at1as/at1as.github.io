<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/syntax.css">
  {% for stylesheet in page.stylesheets %}
  <link rel="stylesheet" href="{{ stylesheet | relative_url }}">
  {% endfor %}

  <link rel="preload" href="/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Favicon -->
  <link rel="shortcut icon" href="/favicon.ico" type="image/ico">
  <link rel="shortcut icon" href="/favicon.png">

  <!-- SEO -->
  {% seo %}
  {% if page.hidden or page.noindex %}
  <meta name="robots" content="noindex, follow">
  {% endif %}

  <!-- Structured Data -->
  {% include structured-data.html %}

  <!-- Feed -->
  {% feed_meta %}

  <!-- JavaScript -->
  <script src="/assets/js/main.js" defer></script>

  <!-- Google Analytics -->
  {% include analytics.html %}
</head>

<body class="{% if page.url == '/' %}home{% elsif page.url contains '/aws-azure-migration-guide/' %}migration-guide{% else %}{{ page.layout | default: 'page' }}{% endif %}">
  <div class="page-container">
    <header class="site-header">
      <div class="container">
        <div class="header-content">
          <div class="site-logo">
            <a href="/" class="logo-link">Jason Willems</a>
          </div>

          <button type="button" class="mobile-menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="site-navigation">
            <span class="hamburger-icon"></span>
          </button>

          <nav class="site-nav" id="site-navigation">
            <ul class="nav-links">
              <li><a href="/" id="homelink" class="nav-link">Home</a></li>
              <li><a href="/travel/" id="travellink" class="nav-link">Travel</a></li>
              <li><a href="/talks/" id="talkslink" class="nav-link">Media</a></li>
              <li><a href="/sites/" id="siteslink" class="nav-link{% if page.url == '/sites/' %} active{% endif %}"{% if page.url == '/sites/' %} aria-current="page"{% endif %}>Sites</a></li>
              <li><a href="/blog/" id="bloglink" class="nav-link">Blog</a></li>
              <li><a href="/contact/" id="contactlink" class="nav-link">Contact</a></li>
            </ul>
          </nav>

        </div>
      </div>
    </header>
