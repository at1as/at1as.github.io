<!-- Structured Data for SEO -->
{% if page.url == '/' %}
<!-- Homepage: Person Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Jason Willems",
  "url": {{ site.url | jsonify }},
  "sameAs": [
    "https://github.com/at1as",
    "https://twitter.com/jasonwillems",
    "https://www.youtube.com/@JasonWillems_"
  ],
  "jobTitle": "Technical Founder, Engineering Leader",
  "description": {{ site.description | jsonify }},
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "San Francisco",
    "addressCountry": "United States"
  },
  "knowsAbout": ["Software Engineering", "Startups", "AI", "Cloud Computing", "Product Development"]
}
</script>
{% endif %}
