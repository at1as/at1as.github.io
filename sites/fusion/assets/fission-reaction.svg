<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 124" role="img" aria-labelledby="title desc">
  <title id="title">Fission splits a heavy uranium nucleus</title>
  <desc id="desc">A neutron strikes uranium-235, splitting it into two smaller nuclei while releasing three neutrons and energy. Schematic, not to scale.</desc>
  <defs>
    <radialGradient id="fission-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8bb8e0" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#8bb8e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="u-grad" cx="38%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#8fb3d4"/>
      <stop offset="100%" stop-color="#476c8f"/>
    </radialGradient>
    <radialGradient id="frag-a" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8ac2b8"/>
      <stop offset="100%" stop-color="#487c78"/>
    </radialGradient>
    <radialGradient id="frag-b" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9cb7d4"/>
      <stop offset="100%" stop-color="#537294"/>
    </radialGradient>
  </defs>
  <rect width="440" height="124" rx="6" fill="#12222d"/>
  <ellipse cx="215" cy="64" rx="110" ry="54" fill="url(#fission-glow)"/>

  <!-- Incoming neutron trail & arrow -->
  <line x1="20" y1="64" x2="70" y2="64" stroke="#85b5cc" stroke-width="2" stroke-dasharray="3 3" opacity=".8"/>
  <path d="M52 64h22m-6-5 6 5-6 5" fill="none" stroke="#9ac6db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="64" r="6.5" fill="#9ac6db" stroke="#12222d" stroke-width="1.5"/>
  <text x="32" y="85" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#a8c9d9">n</text>

  <!-- Heavy U-235 nucleus -->
  <circle cx="114" cy="64" r="30" fill="url(#u-grad)" stroke="#a8cae6" stroke-width="1.5"/>
  <g fill="#d5e8f7" opacity=".2">
    <circle cx="102" cy="54" r="5"/><circle cx="115" cy="48" r="5"/><circle cx="127" cy="56" r="5"/>
    <circle cx="100" cy="69" r="5"/><circle cx="126" cy="72" r="5"/><circle cx="113" cy="79" r="5"/>
  </g>
  <text x="114" y="69" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#f7fbff">U-235</text>

  <!-- Split arrow + energy pill -->
  <path d="M156 64h60m-7-5 7 5-7 5" fill="none" stroke="#7c9db0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="155" y="25" width="66" height="22" rx="11" fill="#3a2a24" stroke="#d9875b" stroke-width="1"/>
  <text x="188" y="40" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#f4b58b">+ energy</text>

  <!-- Two daughter nuclei -->
  <circle cx="268" cy="43" r="21" fill="url(#frag-a)" stroke="#a8d4cb" stroke-width="1.5"/>
  <circle cx="283" cy="88" r="17" fill="url(#frag-b)" stroke="#b3cbe3" stroke-width="1.5"/>

  <!-- 3 emitted neutrons -->
  <g fill="none" stroke="#85b5cc" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round">
    <path d="M294 40 356 22"/>
    <path d="M296 58 362 63"/>
    <path d="M304 89 356 104"/>
  </g>
  <g fill="#9ac6db" stroke="#12222d" stroke-width="1.5">
    <circle cx="364" cy="20" r="5.5"/>
    <circle cx="370" cy="64" r="5.5"/>
    <circle cx="364" cy="106" r="5.5"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#a8c9d9">
    <text x="380" y="24">n</text>
    <text x="386" y="68">n</text>
    <text x="380" y="110">n</text>
  </g>
</svg>
