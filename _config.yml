# Site settings
title: "Jason Willems"
name: "Jason"
description: "Jason Willems – Building products, exploring the world, sharing what I learn"
author:
  name: Jason Willems
  url: "https://www.jasonwillems.com"
  twitter: jasonwillems
email: hello@jasonwillems.com

# URL settings
url: "https://www.jasonwillems.com"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
# Match GitHub Pages builds so post dates and URLs are stable locally.
timezone: UTC

# Shared metadata consumed by jekyll-seo-tag.
twitter:
  username: jasonwillems
  card: summary_large_image
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /photos/jason-july2015.jpg
        alt: Jason Willems

# Pagination for blog
paginate: 8
paginate_path: "/blog/page:num/"

# Collections for content types
collections:
  talks:
    output: true
    permalink: /talks/:path/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Google Analytics
# Replace this with your actual GA4 Measurement ID when ready
google_analytics: "G-Q5N6H3PVG2"

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - lead-migration-docs
